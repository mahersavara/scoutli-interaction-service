# =================================================================  
# PROD PROFILE - PRODUCTION
# =================================================================
# This file is automatically loaded when QUARKUS_PROFILE=prod
# Values here OVERRIDE application.properties
# ALL values come from Kubernetes ConfigMaps/Secrets
# =================================================================

# HTTP Port
%prod.quarkus.http.port=8083

# Database (AWS RDS Production)
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# Keycloak (Production)
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_URL}/realms/scoutli
%prod.quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID}
%prod.quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET}
%prod.quarkus.oidc.tls.verification=required

# Kafka (Production)
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}

# Hibernate
%prod.quarkus.hibernate-orm.log.sql=false
%prod.quarkus.hibernate-orm.database.generation=validate

# Logging
%prod.quarkus.log.level=WARN
%prod.quarkus.log.category."com.scoutli".level=INFO

# Security
%prod.quarkus.security.enabled=true

# SSL/TLS (if using HTTPS)
%prod.quarkus.http.ssl.certificate.file=${SSL_CERT_FILE:/etc/ssl/certs/cert.pem}
%prod.quarkus.http.ssl.certificate.key-file=${SSL_KEY_FILE:/etc/ssl/certs/key.pem}
