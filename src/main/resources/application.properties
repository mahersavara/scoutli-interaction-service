# =================================================================
# SCOUTLI INTERACTION SERVICE - SHARED CONFIGURATION
# =================================================================
# This file contains configuration shared across ALL environments
# Environment-specific values use ${ENV_VAR:default} syntax
#=================================================================

# Application Info
quarkus.application.name=interaction-service
quarkus.http.port=${HTTP_PORT:8083}

# ==================== DATABASE CONFIGURATION ====================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scoutli_interaction}
quarkus.datasource.username=${DB_USERNAME:scoutli}
quarkus.datasource.password=${DB_PASSWORD:scoutli}

# Hibernate
quarkus.hibernate-orm.database.generation=${HIBERNATE_DDL:update}
quarkus.hibernate-orm.log.sql=${SQL_LOGGING:false}

# ==================== KEYCLOAK / OIDC CONFIGURATION ====================
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/scoutli
quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:scoutli-backend}
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET:secret}
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=${KEYCLOAK_URL:http://localhost:8180}/realms/scoutli

# Security
quarkus.security.enabled=${SECURITY_ENABLED:true}

# ==================== KAFKA CONFIGURATION ====================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer: Comment Events
mp.messaging.outgoing.comment-created-out.connector=smallrye-kafka
mp.messaging.outgoing.comment-created-out.topic=comment-events
mp.messaging.outgoing.comment-created-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.comment-created-out.transactional=false

# Consumer: Comment Events
mp.messaging.incoming.comment-created-in.connector=smallrye-kafka
mp.messaging.incoming.comment-created-in.topic=comment-events
mp.messaging.incoming.comment-created-in.group.id=interaction-service
mp.messaging.incoming.comment-created-in.auto.offset.reset=earliest

# ==================== LOGGING ====================
quarkus.log.level=${LOG_LEVEL:INFO}