# =================================================================  
# UAT PROFILE - USER ACCEPTANCE TESTING
# =================================================================
# This file is automatically loaded when QUARKUS_PROFILE=uat
# Values here OVERRIDE application.properties
# =================================================================

# HTTP Port
%uat.quarkus.http.port=8083

# Database (AWS RDS UAT)
%uat.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
%uat.quarkus.datasource.username=${DB_USERNAME}
%uat.quarkus.datasource.password=${DB_PASSWORD}

# Keycloak (UAT Environment)
%uat.quarkus.oidc.auth-server-url=${KEYCLOAK_URL}/realms/scoutli
%uat.quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID}
%uat.quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET}
%uat.quarkus.oidc.tls.verification=required

# Kafka (UAT)
%uat.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}

# Hibernate
%uat.quarkus.hibernate-orm.log.sql=false
%uat.quarkus.hibernate-orm.database.generation=validate

# Logging
%uat.quarkus.log.level=INFO
