# =================================================================  
# DEV PROFILE - LOCAL DEVELOPMENT
# =================================================================
# This file is automatically loaded when QUARKUS_PROFILE=dev
# Values here OVERRIDE application.properties
# =================================================================

# HTTP Port
%dev.quarkus.http.port=8083

# Database (Local Docker)
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5434/scoutli_interaction
%dev.quarkus.datasource.username=scoutli
%dev.quarkus.datasource.password=scoutli

# Keycloak (Local Docker on port 8180)
%dev.quarkus.oidc.auth-server-url=http://localhost:8180/realms/scoutli
%dev.quarkus.oidc.client-id=scoutli-backend
%dev.quarkus.oidc.credentials.secret=secret
%dev.quarkus.oidc.tls.verification=none

# Kafka (Local Docker)
%dev.kafka.bootstrap.servers=localhost:9092

# Hibernate
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.database.generation=update

# Logging
%dev.quarkus.log.level=DEBUG
%dev.quarkus.log.category."com.scoutli".level=DEBUG

# Dev Features
%dev.quarkus.devservices.enabled=false
